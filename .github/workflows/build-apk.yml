name: Build MGym APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MGym-0.2.2.apk
          cd dist
          sha256sum MGym-0.2.2.apk > SHA256SUMS-0.2.2.txt
          echo "Build commit: $GITHUB_SHA" > BUILD-INFO.txt
          echo "Version: 0.2.2" >> BUILD-INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGym-0.2.2
          path: dist/
          if-no-files-found: error
          retention-days: 30
